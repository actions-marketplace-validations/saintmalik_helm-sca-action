# Example: inventory + scan a single local Helm chart via helm-sca-action.

name: helm-sca (single chart)

on:
  pull_request:
    paths:
      - "charts/demo/**"

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan chart images
        uses: saintmalik/helm-sca-action@<commit-sha>
        with:
          mode: chart
          chart: ./charts/demo
          values: ./charts/demo/ci-values.yaml
          fail-on: high
          command: scan
